[package]
name = "skillsmerge"
version = "1.1.0"
edition = "2021"
description = "A priority compiler for merging AI SKILLS files — resolve conflicts across multi-format skill definitions with AI-assisted semantic understanding"
license = "MIT"
repository = "https://github.com/tev6/SkillsMerge"
homepage = "https://github.com/tev6/SkillsMerge"
documentation = "https://github.com/tev6/SkillsMerge"
readme = "README.en.md"
keywords = ["skills", "merge", "ai", "llm", "conflict-resolution", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github/",
    ".env.example",
    "justfile",
    "tests/fixtures/",
    "examples/",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rayon = "1"
pulldown-cmark = "0.11"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
